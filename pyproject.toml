[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simupoke"
version = "0.1.0"
description = "Outil hors-ligne d'aide à la décision pour Pokémon Champions (Phase 0 : socle données & stats)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
simupoke = "simupoke.cli:main"
simupoke-server = "simupoke.server:main"
simupoke-import-usage = "simupoke.usage_import:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
