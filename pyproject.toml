[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simupoke"
version = "0.1.0"
description = "Outil hors-ligne d'aide à la décision pour Pokémon Champions (Phase 0 : socle données & stats)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
simupoke = "simupoke.cli:main"
simupoke-server = "simupoke.server:main"
simupoke-import-usage = "simupoke.usage_import:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "PIE", "C4", "RUF"]
# Le projet est en français avec des symboles de domaine (×, →, é…) :
# les règles « caractère unicode ambigu » ne s'appliquent pas.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Le docstring de la CLI est une référence d'usage : lignes longues assumées.
"src/simupoke/cli.py" = ["E501"]
