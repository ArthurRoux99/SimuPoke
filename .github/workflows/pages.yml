name: pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build la page autonome (calc, racine)
        run: python scripts/build_web.py

      - name: Build l'app Pyodide (PWA, /app/)
        run: python scripts/build_pyodide.py

      - name: Préparer _site
        # Racine = page calc autonome (légère, moteur JS embarqué).
        # /app/ = l'app complète en PWA (moteur Python via Pyodide, installable).
        run: |
          mkdir -p _site/app
          cp web/dist/simupoke.html _site/index.html
          cp -r web/pyodide/dist/. _site/app/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
